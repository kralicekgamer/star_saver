[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star_saver"
version = "0.1.0"
description = "A colorful animated terminal night-sky screensaver"
requires-python = ">=3.10"
dependencies = ["rich>=13.7.0"]

[project.scripts]
star_saver = "star_saver:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
